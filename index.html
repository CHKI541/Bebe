<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>¡Adivina Adivinador! 👶</title>
<meta name="description" content="Votá si el bebé va a ser varón o nena y mirá en vivo qué votó el resto de la familia." />
<meta name="theme-color" content="#FAFAFA" />
<meta property="og:title" content="¡Adivina Adivinador! 👶" />
<meta property="og:description" content="¿Varón o nena? Votá y descubrí qué cree el resto de la familia." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%B6%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <main id="app" class="app">

    <!-- ===================== PANTALLA 1: BIENVENIDA ===================== -->
    <section id="screen-welcome" class="screen active">
      <div class="card card--welcome">
        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="56" height="56">
            <circle cx="50" cy="50" r="34" fill="none" stroke="#C9A66B" stroke-width="2" opacity="0.85"/>
            <circle cx="50" cy="50" r="39" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.5"/>
            <path d="M50 63 C37 52 31 44 31 36 C31 29 36 25 42 25 C47 25 50 28.5 50 33 C50 28.5 53 25 58 25 C64 25 69 29 69 36 C69 44 63 52 50 63 Z" fill="#C9A66B" opacity="0.85"/>
          </svg>
        </div>
        <h1 class="title">¡Adivina Adivinador!</h1>
        <p class="subtitle">¿Va a ser varón o nena? Votá y descubrí qué cree el resto de la familia.</p>
        <form id="welcome-form" autocomplete="off">
          <label for="name-input" class="sr-only">Tu nombre</label>
          <input type="text" id="name-input" name="name" placeholder="Ingresá tu nombre" maxlength="30" autocapitalize="words" autocomplete="off" required />
          <button type="submit" class="btn btn--primary btn--block">Entrar</button>
        </form>
      </div>
    </section>

    <!-- ===================== PANTALLA 2: VOTACIÓN ===================== -->
    <section id="screen-vote" class="screen">
      <div class="vote-header">
        <p class="greeting" id="greeting-text">¿Vos qué creés?</p>
        <p class="hint">Tocá una opción para votar</p>
      </div>

      <div class="vote-cards">

        <button type="button" class="vote-card vote-card--boy" data-vote="varon" aria-pressed="false">
          <span class="vote-card__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </span>
          <svg class="vote-card__icon" viewBox="0 0 200 200" role="img" aria-label="Bebé varón">
            <defs>
              <filter id="soften-boy" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5"/>
              </filter>
            </defs>
            <g filter="url(#soften-boy)">
              <circle cx="100" cy="100" r="76" fill="#E3F2FD"/>
              <circle cx="128" cy="82" r="42" fill="#E3F2FD"/>
              <circle cx="72" cy="122" r="46" fill="#E3F2FD"/>
            </g>
            <circle cx="100" cy="100" r="68" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.8"/>
            <circle cx="100" cy="100" r="73" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.55"/>
            <ellipse cx="100" cy="78" rx="20" ry="9" fill="#FFFFFF"/>
            <rect x="65" y="80" width="70" height="72" rx="26" fill="#90CAF9"/>
            <ellipse cx="58" cy="95" rx="17" ry="13" fill="#90CAF9"/>
            <ellipse cx="142" cy="95" rx="17" ry="13" fill="#90CAF9"/>
            <polygon points="85,73 85,91 100,82" fill="#1565C0"/>
            <polygon points="115,73 115,91 100,82" fill="#1565C0"/>
            <rect x="96.5" y="77.5" width="7" height="9" rx="2.2" fill="#1565C0"/>
            <circle cx="100" cy="102" r="3.5" fill="#FFFFFF"/>
            <circle cx="100" cy="118" r="3.5" fill="#FFFFFF"/>
            <circle cx="100" cy="134" r="3.5" fill="#FFFFFF"/>
            <circle cx="82" cy="148" r="3" fill="#FFFFFF"/>
            <circle cx="118" cy="148" r="3" fill="#FFFFFF"/>
          </svg>
          <span class="vote-card__label">¡Es Varón!</span>
        </button>

        <button type="button" class="vote-card vote-card--girl" data-vote="nena" aria-pressed="false">
          <span class="vote-card__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </span>
          <svg class="vote-card__icon" viewBox="0 0 200 200" role="img" aria-label="Bebé nena">
            <defs>
              <filter id="soften-girl" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5"/>
              </filter>
            </defs>
            <g filter="url(#soften-girl)">
              <circle cx="100" cy="100" r="76" fill="#FCE4EC"/>
              <circle cx="128" cy="82" r="42" fill="#FCE4EC"/>
              <circle cx="72" cy="122" r="46" fill="#FCE4EC"/>
            </g>
            <circle cx="100" cy="100" r="68" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.8"/>
            <circle cx="100" cy="100" r="73" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.55"/>
            <ellipse cx="100" cy="80" rx="20" ry="9" fill="#FFFFFF"/>
            <rect x="65" y="82" width="70" height="70" rx="26" fill="#F48FB1"/>
            <ellipse cx="58" cy="97" rx="17" ry="13" fill="#F48FB1"/>
            <ellipse cx="142" cy="97" rx="17" ry="13" fill="#F48FB1"/>
            <circle cx="100" cy="104" r="3.5" fill="#FFFFFF"/>
            <circle cx="100" cy="120" r="3.5" fill="#FFFFFF"/>
            <circle cx="100" cy="136" r="3.5" fill="#FFFFFF"/>
            <circle cx="82" cy="149" r="3" fill="#FFFFFF"/>
            <circle cx="118" cy="149" r="3" fill="#FFFFFF"/>
            <ellipse cx="87" cy="63" rx="13" ry="9" fill="#AD1457" transform="rotate(-25 87 63)"/>
            <ellipse cx="113" cy="63" rx="13" ry="9" fill="#AD1457" transform="rotate(25 113 63)"/>
            <circle cx="100" cy="65" r="5.5" fill="#AD1457"/>
          </svg>
          <span class="vote-card__label">¡Es Nena!</span>
        </button>

        <button type="button" class="vote-card vote-card--unsure" data-vote="nididea" aria-pressed="false">
          <span class="vote-card__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </span>
          <svg class="vote-card__icon" viewBox="0 0 200 200" role="img" aria-label="Sonajero con signo de pregunta">
            <defs>
              <filter id="soften-unsure" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5"/>
              </filter>
            </defs>
            <g filter="url(#soften-unsure)">
              <circle cx="100" cy="100" r="76" fill="#FFF8E1"/>
              <circle cx="128" cy="82" r="42" fill="#FFF8E1"/>
              <circle cx="72" cy="122" r="46" fill="#FFF8E1"/>
            </g>
            <circle cx="100" cy="100" r="68" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.8"/>
            <circle cx="100" cy="100" r="73" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.55"/>
            <circle cx="76" cy="100" r="30" fill="#FFE082"/>
            <circle cx="66" cy="90" r="3" fill="#FFFFFF" opacity="0.9"/>
            <circle cx="88" cy="93" r="2.5" fill="#FFFFFF" opacity="0.9"/>
            <circle cx="73" cy="110" r="2.5" fill="#FFFFFF" opacity="0.9"/>
            <circle cx="86" cy="107" r="3" fill="#FFFFFF" opacity="0.9"/>
            <rect x="68" y="123" width="16" height="38" rx="8" fill="#F5B942"/>
            <ellipse cx="69" cy="126" rx="7" ry="5" fill="#F57F17" transform="rotate(-20 69 126)"/>
            <ellipse cx="83" cy="126" rx="7" ry="5" fill="#F57F17" transform="rotate(20 83 126)"/>
            <circle cx="76" cy="126" r="3.5" fill="#F57F17"/>
            <text x="132" y="117" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="700" fill="#F57F17" text-anchor="middle">?</text>
          </svg>
          <span class="vote-card__label">Ni Idea</span>
        </button>

      </div>
    </section>

    <!-- ===================== PANTALLA 3: RESULTADOS ===================== -->
    <section id="screen-results" class="screen">
      <div class="results-header">
        <p class="results-greeting" id="results-greeting">¡Gracias por votar!</p>

        <div id="timer-box" class="timer-box">
          <div class="timer-box__row">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#B08D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            <span>Podés cambiar tu voto durante <strong id="timer-text">5:00</strong></span>
          </div>
          <button type="button" id="change-vote-btn" class="btn btn--ghost btn--small">Cambiar mi voto</button>
        </div>

        <div id="locked-box" class="locked-box" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span>Tu voto está bloqueado</span>
        </div>
      </div>

      <div class="results-body">
        <h2 class="section-title">Resultados en vivo</h2>
        <div id="bars" class="bars"></div>

        <h2 class="section-title">¿Quién votó qué?</h2>
        <ul id="voter-list" class="voter-list"></ul>
      </div>

      <div class="results-footer">
        <button type="button" id="share-btn" class="btn btn--ghost btn--small">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.6l7.6-4.2M8.2 13.4l7.6 4.2"/></svg>
          Copiar link para invitar
        </button>
        <button type="button" id="restart-btn" class="link-btn">¿Sos otra persona? Volvé a empezar</button>
      </div>
    </section>

  </main>

  <!-- ===================== MODAL DE CONFIRMACIÓN ===================== -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p id="modal-title" class="modal-title">¿Confirmás tu voto por <span id="modal-choice"></span>?</p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn--ghost">Cancelar</button>
        <button type="button" id="modal-confirm" class="btn btn--primary">Sí, confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
